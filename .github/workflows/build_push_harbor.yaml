name: Build and push alertmanager-discord to Harbor

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      # The sources are flat at the repository root, so this matches them and nothing deeper.
      - "*.js"
      - "Dockerfile"
      - "package.json"
      - "yarn.lock"

env:
  REGISTRY: registry.dev.k8s-dev.org
  REPOSITORY: team-vroom
  APP: alertmanager-discord
  IMAGE_TAG: dev
  REGISTRY_USER: robot$team-vroom+alertmanager-discord

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    environment: harbor_dev_release
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_DEV_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG }}
