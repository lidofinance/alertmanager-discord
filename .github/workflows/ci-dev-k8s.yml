name: Build and push alertmanager-discord to dev

run-name: Build and push alertmanager-discord:dev to dev

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    # paths-ignore, not an allowlist: a forgotten allowlist entry ships a stale image with a green pipeline.
    paths-ignore:
      - '.github/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  build-and-push:
    # @main until the DevOps rollout settles, then a reviewed commit SHA.
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: dev
      harbor_project: team-vroom
      image: alertmanager-discord
    secrets: inherit
